# The declared external writer of ghcr.io/appthrust/platform/neon-compute
# (appthrust/platform hack/ghcr-external-writers.yaml, ADR-0091). It runs only
# by dispatch on appthrust/main; the platform promotion verifies this exact
# workflow identity, the run, and the provenance before the image is released.
name: AppThrust compute image

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: appthrust-compute-image
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/appthrust/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/appthrust/platform/neon-compute
      SIGNER_IDENTITY: https://github.com/appthrust/neon/.github/workflows/appthrust-compute-image.yml@refs/heads/appthrust/main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the compute image
        id: build
        env:
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/bake-metadata.json"
          docker buildx bake --file compute/appthrust/docker-bake.hcl --push --metadata-file "${metadata}" neon-compute
          digest="$(jq -er '."neon-compute"."containerimage.digest"' "${metadata}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image digest: ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign with this workflow's identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`${IMAGE}:${RUN_ID}-bullseye@${DIGEST}\` |"
            echo "| head commit | \`${GIT_SHA}\` |"
            echo "| signer identity | \`${SIGNER_IDENTITY}\` |"
          } >>"${GITHUB_STEP_SUMMARY}"
